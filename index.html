<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CodeByWin iOS Repo</title>
    <link rel="icon" type="image/png" href="CydiaIcon.png">
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --text-sub: #8e8e93;
            --primary: #007aff;
            --primary-hover: #0056b3;
            --border: #e5e5ea;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-color: #f2f2f7;
                --text-sub: #8e8e93;
                --primary: #0a84ff;
                --primary-hover: #409cff;
                --border: #2c2c2e;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 24px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-sileo {
            background-color: #2c97de;
            color: white;
        }
        .btn-zebra {
            background-color: #433990;
            color: white;
        }
        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .section-title {
            text-align: left;
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 12px 4px;
        }
        .package-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            text-align: left;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .package-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 4px;
        }
        .package-id {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-family: monospace;
        }
        .package-desc {
            font-size: 14px;
            color: var(--text-color);
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            background-color: var(--border);
            color: var(--text-color);
            margin-right: 6px;
        }
        .repo-url-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            font-family: monospace;
            word-break: break-all;
            margin-top: 12px;
            color: var(--primary);
            user-select: all;
        }
        footer {
            margin-top: 40px;
            color: var(--text-sub);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="icon" src="CydiaIcon.png" alt="Repo Icon">
        <h1>CodeByWin Repo</h1>
        <p class="subtitle">Kho tweak Jailbreak iOS (Rootless & RootHide)</p>

        <div class="actions">
            <a id="btn-sileo" class="btn btn-sileo" href="#">Thêm vào Sileo</a>
            <a id="btn-zebra" class="btn btn-zebra" href="#">Thêm vào Zebra</a>
            <button class="btn btn-secondary" onclick="copyRepoURL()">Sao chép URL Repo</button>
        </div>

        <div class="repo-url-box" id="repo-url-display">Đang tải URL...</div>

        <h2 class="section-title">Danh sách Gói (Packages)</h2>

        <div class="package-card">
            <div class="package-title">HideDeveloperMode</div>
            <div class="package-id">com.hid.dev</div>
            <div class="package-desc">Spoof & Hide iOS 16 Developer Mode & SSH</div>
            <div>
                <span class="badge">Rootless (arm64)</span>
                <span class="badge">RootHide (arm64e)</span>
                <span class="badge">v1.0.0</span>
            </div>
        </div>

        <footer>
            &copy; 2026 CodeByWin. Powered by GitHub Pages.
        </footer>
    </div>

    <script>
        // Tự động nhận diện URL repo bất kể deploy ở repo hay tên miền nào
        const repoUrl = window.location.href.split('?')[0].split('#')[0];
        document.getElementById('repo-url-display').innerText = repoUrl;
        document.getElementById('btn-sileo').href = 'sileo://source/' + repoUrl;
        document.getElementById('btn-zebra').href = 'zbra://sources/add/' + repoUrl;

        function copyRepoURL() {
            navigator.clipboard.writeText(repoUrl).then(() => {
                alert('Đã sao chép link Repo vào bộ nhớ tạm: ' + repoUrl);
            }).catch(() => {
                alert('Link: ' + repoUrl);
            });
        }
    </script>
</body>
</html>
